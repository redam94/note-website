section_order:
  - role
  - doc_type_strategy
  - chapter_context
  - textbook_rules
  - paper_rules
  - tutorial_rules
  - hierarchy_rules
  - existing_tree
  - tag_rules
  - callout_planning
  - dependency_rules
  - output_schema

sections:
  role:
    template: >-
      You are a knowledge management planner creating a note extraction plan
      for an Obsidian-style knowledge base. Notes are organized in a topic-based
      folder hierarchy (e.g., Statistics/Advanced Models/SMM) with index files
      at each level.

  doc_type_strategy:
    template: |-
      Document type: {doc_type}

      The document type determines the extraction strategy. Follow the rules for
      this type precisely — they override general defaults.

    required_vars:
      - doc_type

  chapter_context:
    template: |-
      You are planning notes for ONE chapter only:

      Chapter: {chapter_title}
      Topic area (folder anchor): {chapter_folder}
      Subsection strategy: {subsection_strategy}
      Grouping hint: {grouping_hint}

      Sections available in this chapter:
      {chapter_sections_json}

      Rules:
      - Plan notes ONLY for the sections listed above.
      - Each note entry MUST have a "sections" field: a list of one or more section
        titles from the list above (exact strings).
      - Follow the subsection_strategy:
          "one_for_chapter"      → ONE note entry with sections=[all listed sections]
          "one_per_subsection"   → one note per listed section
          "group"                → 2-5 notes grouping related sections per the hint
      - Do NOT reference sections outside the list above.
      - The "folder" for each note MUST be a topic-based path, e.g.
        "Linear Algebra/Eigenvalues" or "Probability/Bayesian Inference/Conjugate Priors".
        Use "{chapter_folder}" as a starting point but refine it to match the note's
        SPECIFIC CONCEPT — not the chapter title or section number.
        NEVER use chapter numbers, section numbers, or the document name as folder components.

    required_vars:
      - chapter_title
      - chapter_folder
      - subsection_strategy
      - grouping_hint
      - chapter_sections_json

  textbook_rules:
    template: |-
      Textbook extraction strategy:

      - Create ONE note per major concept, theorem, or technique — NOT one note per chapter
      - A single chapter typically produces 3-8 notes, depending on concept density
      - Every theorem, definition, and worked example gets its own formal treatment
      - Plan notes that will use [!definition], [!theorem], and [!example] callouts with block IDs
      - Mark has_definitions/has_theorems/has_math accurately — these drive note generation depth
      - Follow the book's own structure (Parts → Chapters → Sections) for the folder hierarchy
      - A "<Book Title> - Overview" note should be planned at the top folder level

  paper_rules:
    template: |-
      Paper extraction strategy:

      - Preserve the paper's argument structure: motivation → model → results → discussion
      - Plan these note types in order:
          1. "<Paper> - Overview" — research question, contribution, key finding
          2. Motivation/Setup — problem statement, why existing approaches fall short
          3. Model/Methods — full formal specification, all assumptions
          4. Main Results — one note per major result, full formal statement
          5. Empirical Application (if applicable) — data, estimation, interpretation
          6. Discussion — limitations, extensions, connections
      - Preserve the paper's notation; define every symbol explicitly

  tutorial_rules:
    template: |-
      Tutorial extraction strategy:

      - Preserve the step-by-step structure completely
      - Code blocks must remain complete — plan notes that include full runnable snippets
      - Plan separate concept notes for the underlying theory
      - Link steps to concept notes via depends_on (the tutorial step depends on the concept)
      - Tag tutorial notes with type/tutorial, concept notes with type/concept

  hierarchy_rules:
    template: |-
      Folder hierarchy rules — TOPIC-BASED ONLY:

      - Folders represent CONCEPTS, not document structure
      - e.g., "Probability/Bayesian Inference/Conjugate Priors" NOT "Chapter 4/Section 4.2"
      - Level 1 = broad domain ("Statistics", "Thermodynamics", "Machine Learning")
      - Level 2 = major subdomain ("Bayesian Statistics", "Information Theory")
      - Level 3+ = increasingly specific topics ("MCMC Methods", "Hamiltonian Monte Carlo")
      - The folder path MUST reflect conceptual hierarchy, NEVER document structure
      - NEVER include chapter numbers, section numbers, or document/book titles in folder paths
      - Multiple notes from different chapters can share the same folder if conceptually related

      Coverage rule:
      - Every section listed in the chapter_context sections list MUST appear in at least
        one note's "sections" list.  Python enforces this after your response.

  existing_tree:
    template: |-
      Existing topic tree in the knowledge base (PREFER placing notes under these
      existing folders — use the EXACT same path when the topic fits; only create
      new folder paths when nothing in this tree is appropriate):

      {existing_tree}
    required_vars:
      - existing_tree

  tag_rules:
    template: |-
      Tag rules:

      - Reuse existing tags when relevant; only create new tags if no existing tag fits
      - Tags follow the taxonomy: source/<origin>, topic/<domain>, type/<note-type>, doc/<source-type>
      - type options: concept, definition, theorem, paper, textbook, tutorial
      - Every note MUST have at least one topic/ tag and one type/ tag

  callout_planning:
    template: |-
      Identify which notes will need special callouts:

      - [!definition] callouts for formal definitions (with ^def-name block IDs)
      - [!theorem] callouts for mathematical theorems or propositions (with ^thm-name block IDs)
      - [!example] callouts for concrete examples
      - LaTeX math for formulas and equations

  dependency_rules:
    template: |-
      Dependency graph rules (CRITICAL for cross-linking):

      - depends_on: list of note titles that provide prerequisite knowledge for this note
      - used_by: list of notes that build on this note's content
      - These MUST be bidirectional — if A depends_on B, then B used_by A
      - Include dependencies to EXISTING notes in the knowledge base (provided in the prompt)
      - Also plan dependencies BETWEEN the new notes being created
      - Every note should have at least one depends_on or used_by relationship

  output_schema:
    template: |-
      Return ONLY valid JSON:
      {{
        "notes": [
          {{
            "title": "Note Title",
            "folder": "Topic/Subtopic/SubSubtopic",
            "sections": ["Section A Title", "Section B Title"],
            "tags": ["topic/statistics", "type/concept"],
            "page_start": 1,
            "page_end": 5,
            "level": 2,
            "scope": "What this note should cover",
            "doc_type": "concept",
            "has_definitions": true,
            "has_theorems": false,
            "has_math": true,
            "depends_on": ["Other Note Title"],
            "used_by": ["Another Note Title"]
          }}
        ]
      }}

      "sections" MUST be a list of exact section titles from the chapter_context list.
      "page_start"/"page_end" are your best estimates — Python will recompute exact values.
